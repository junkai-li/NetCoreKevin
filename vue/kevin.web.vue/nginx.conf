# WebSocket（SignalR）连接头处理
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大文件（音频/图片/知识库文档）
    client_max_body_size 200m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA：history 路由统一回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口（含 SignalR 与 AI 的 SSE 流式输出）
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # 用 $http_host 保留浏览器地址中的端口（后端生成的上传文件 URL 依赖它）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # AI 流式响应必须关闭缓冲，否则要等全部输出完才到浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后台上传的静态文件目录（WebApi 的 /KevinFlies 静态中间件）
    location /KevinFlies/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容 vue.config.js 里 /VarApi 代理前缀（重写后转发到后端根路径）
    location /VarApi/ {
        rewrite ^/VarApi/(.*)$ /$1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
