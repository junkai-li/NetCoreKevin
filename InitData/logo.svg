    <path d="M188 158 V212" stroke="#ffffff" stroke-opacity="0.16" stroke-width="9" stroke-linecap="round"/>
    <path d="M248 208 L300 150" stroke="#ffffff" stroke-opacity="0.14" stroke-width="8" stroke-linecap="round"/>
